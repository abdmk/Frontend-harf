<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مكتبة حرف — خطوط عربية مجانية ومدفوعة</title>
    <meta name="description" content="مكتبة حرف: خطوط عربية ومتعددة اللغات، مجانية ومدفوعة، بتراخيص واضحة." />
    <script>
      // تطبيق الوضع المحفوظ قبل أول رسم — يمنع وميض الفاتح قبل الداكن
      (function () {
        try {
          var t = localStorage.getItem('harf-theme');
          if (t !== 'light' && t !== 'dark')
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var d = document.documentElement;
          d.classList.toggle('dark', t === 'dark');
          d.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-dvh font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
