<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>عين — نسخة القزحية</title>
    <!-- خطوط المكتبة الحقيقية (نفس ملفات الموقع) -->
    <link rel="stylesheet" href="/src/assets/fonts/library/library.css" />
    <style>
      @font-face {
        font-family: 'Graphik Arabic';
        src: url('/src/assets/fonts/graphik-arabic-300.woff2') format('woff2');
        font-weight: 300;
      }
      @font-face {
        font-family: 'Graphik Arabic';
        src: url('/src/assets/fonts/graphik-arabic-400.woff2') format('woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: 'Graphik Arabic';
        src: url('/src/assets/fonts/graphik-arabic-500.woff2') format('woff2');
        font-weight: 500;
      }
      @font-face {
        font-family: 'Graphik Arabic';
        src: url('/src/assets/fonts/graphik-arabic-600.woff2') format('woff2');
        font-weight: 600;
      }

      /* رموز التصميم — الوضع الليلي من src/design-system/tokens.css (‎.dark) */
      :root {
        --primary: #f25558;
        --primary-fill: #df3033;
        --harf-200: #ffc8c9;
        --harf-300: #fca0a2;
        --harf-400: #f56d70;
        --harf-500: #ec3b3c;
        --harf-600: #d22528;
        --harf-700: #ae1d20;
        --harf-800: #8c1a1c;
        --harf-900: #711819;
        --tint-brand: #3a1b1d;
        --background: #100f0f;
        --foreground: #f4f4f4;
        --card: #151414;
        --sunken: #1e1e1e;
        --inset: #2a2929;
        --border: #2a2a2a;
        --strong: #3a3a3a;
        --muted-foreground: #a3a3a3;
        --tertiary: #8e8e8e;
        --ok-500: #3dce68;
        --ok-700: #1e8540;
        --ok-text: #3dce68;
        --warn-500: #f0a020;
        --gold-500: #f5a524;
        --gold-foreground: #3b2500;
        --dawn-1: #ffd9c4;
        --dawn-2: #fbd3e5;
        --font-sans: 'Graphik Arabic', sans-serif;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--background);
      }
      body {
        overflow: hidden;
        font-family: var(--font-sans);
        color: var(--foreground);
        -webkit-font-smoothing: antialiased;
        font-variant-numeric: tabular-nums lining-nums;
      }
      #stage {
        position: relative;
        overflow: hidden;
        background: var(--background);
      }
      /* توهّج خافت ثابت في العمق — يمنح الأرضية الداكنة حجماً بلا تشويش */
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(60% 55% at 50% 45%, rgb(236 59 60 / 0.07), transparent 70%);
      }
      #glow {
        position: absolute;
        inset: 0;
        opacity: 0;
        background:
          radial-gradient(38% 42% at 50% 48%, rgb(236 59 60 / 0.32), transparent 70%),
          radial-gradient(60% 60% at 70% 30%, rgb(255 217 196 / 0.1), transparent 70%);
      }
      .el {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 50% 50%;
      }
      .word {
        white-space: nowrap;
        line-height: 1.3;
        font-weight: 500;
      }
      .ltr {
        direction: ltr;
        unicode-bidi: isolate;
      }
      .icon {
        width: 1em;
        height: 1em;
        fill: currentColor;
        flex: none;
      }
      .tile {
        position: absolute;
        border-radius: 22px;
        overflow: hidden;
        display: grid;
        place-items: center;
        box-sizing: border-box;
      }
      .tile small {
        position: absolute;
        bottom: 14px;
        inset-inline: 18px;
        font-family: var(--font-sans);
        font-size: 13px;
        letter-spacing: 0.04em;
        opacity: 0.6;
        display: flex;
        justify-content: space-between;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        padding: 0 18px;
        border-radius: 999px;
        font-size: 17px;
        font-weight: 500;
        white-space: nowrap;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        height: 60px;
        padding: 0 30px;
        border-radius: 14px;
        font-size: 21px;
        font-weight: 500;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="vignette"></div>
      <div id="glow"></div>
    </div>
    <script src="../shared/engine.js"></script>
    <script src="./timeline.js"></script>
  </body>
</html>
